- name: Convert gitascii.json to SVG
        run: |
          node -e '
          const fs = require("fs");
          try {
            const data = JSON.parse(fs.readFileSync("gitascii.json", "utf8"));
            
            // Extract ASCII lines array from gitascii.json widgets structure
            let lines = [];
            if (data.widgets && Array.isArray(data.widgets)) {
              const asciiWidget = data.widgets.find(w => w.type === "ascii-art");
              if (asciiWidget && asciiWidget.data && Array.isArray(asciiWidget.data.asciiText)) {
                lines = asciiWidget.data.asciiText;
              }
            }
            if (lines.length === 0) {
              lines = Array.isArray(data.ascii) ? data.ascii : [JSON.stringify(data, null, 2)];
            }

            // Create individual <tspan> elements for each line to preserve formatting
            const tspanContent = lines.map((line, idx) => 
              `<tspan x="15" dy="${idx === 0 ? 0 : '1.1em'}">${line.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")}</tspan>`
            ).join("");

            const svgContent = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
            <style>
              .bg { fill: #0d1117; rx: 8px; }
              .header { fill: #161b22; rx: 8px 8px 0 0; }
              .btn-red { fill: #ff5f56; }
              .btn-yellow { fill: #ffbd2e; }
              .btn-green { fill: #27c93f; }
              .title { font-family: monospace; fill: #8b949e; font-size: 13px; text-anchor: middle; }
              .ascii { font-family: "Courier New", Courier, monospace; font-size: 3.5px; fill: #3fb950; white-space: pre; }
            </style>
            <rect class="bg" width="800" height="520" />
            <rect class="header" width="800" height="35" />
            <circle class="btn-red" cx="20" cy="18" r="6" />
            <circle class="btn-yellow" cx="40" cy="18" r="6" />
            <circle class="btn-green" cx="60" cy="18" r="6" />
            <text class="title" x="400" y="22">metrixit3@github: ~ $ ./portrait.sh</text>
            <text class="ascii" x="15" y="55" xml:space="preserve">${tspanContent}</text>
          </svg>`;

            fs.writeFileSync("info-card.svg", svgContent);
            console.log("Successfully generated info-card.svg with formatted ASCII lines");
          } catch (err) {
            console.error("Error generating SVG:", err);
            process.exit(1);
          }
          '
