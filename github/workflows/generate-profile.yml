name: Generate Profile Art Card

on:
  push:
    paths:
      - 'gitascii.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Profile Generator Tool
        run: npm install -g @gitascii/cli || npm install -g gitascii

      - name: Compile JSON configuration to SVG Asset
        run: gitascii build --config gitascii.json --output info-card.svg

      - name: Commit and Push Compiled Asset
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add info-card.svg
          git commit -m "chore: auto-regenerate profile card artwork" || exit 0
          git push
